# Cloudflare credentials from the macOS keychain (same entries remy-auth uses).
[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]
CLOUDFLARE_API_TOKEN = { provider = "keychain", value = "CLOUDFLARE_API_TOKEN" }
CLOUDFLARE_ACCOUNT_ID= { provider = "keychain", value = "CLOUDFLARE_ACCOUNT_ID" }
ICELIGHT_API_TOKEN= { provider = "keychain", value = "ICELIGHT_API_TOKEN" }
